name: Build Dhikri Android APK

on:
  push:
    branches: [main]
    paths:
      - "source/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Restore Android source archive
        run: |
          test -s source/DhikriAndroid-v2-Source-fixed.zip.b64
          base64 --decode source/DhikriAndroid-v2-Source-fixed.zip.b64 > /tmp/dhikri-source.zip
          unzip -q /tmp/dhikri-source.zip -d .
          test -f DhikriAndroid/app/build.gradle.kts
          grep -F 'Regex("""([01]\\d|2[0-3]):[0-5]\\d""")' DhikriAndroid/app/src/main/java/com/medhat/dhikri/MainActivity.kt

      - name: Build debug APK
        run: |
          cd DhikriAndroid
          gradle --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Dhikri-debug-apk
          path: DhikriAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
