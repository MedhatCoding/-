name: Build Dhikri Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'source/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore Android source archive
        shell: bash
        run: |
          cat source/part-1.b64 source/part-2.b64 source/part-3.b64 source/part-4a.b64 source/part-4b.b64 source/part-4c.b64 source/part-4d.b64 > /tmp/dhikri-source.zip.b64
          base64 --decode /tmp/dhikri-source.zip.b64 > /tmp/dhikri-source.zip
          unzip -tq /tmp/dhikri-source.zip
          unzip -q /tmp/dhikri-source.zip -d .
          test -f DhikriAndroid/app/build.gradle.kts
      - name: Install complete Dhikri logo
        shell: bash
        run: |
          python3 -m pip install --quiet pillow
          curl -fL --retry 3 'https://raw.githubusercontent.com/MedhatCoding/-/main/assets/branding/dhikri-logo.png' -o /tmp/dhikri-logo.png
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          import re
          root = Path('DhikriAndroid/app/src/main')
          manifest = root / 'AndroidManifest.xml'
          text = manifest.read_text(encoding='utf-8')
          image = Image.open('/tmp/dhikri-logo.png').convert('RGBA')
          if image.width < 64 or image.height < 64:
              raise SystemExit(f'Logo image is unexpectedly small: {image.size}')
          sizes = {'mipmap-mdpi':48, 'mipmap-hdpi':72, 'mipmap-xhdpi':96, 'mipmap-xxhdpi':144, 'mipmap-xxxhdpi':192}
          for folder, size in sizes.items():
              target = root / 'res' / folder
              target.mkdir(parents=True, exist_ok=True)
              image.resize((size, size), Image.Resampling.LANCZOS).save(target / 'dhikri_logo.png', optimize=True)
          if re.search(r'android:icon="@[^" ]+"', text):
              text = re.sub(r'android:icon="@[^" ]+"', 'android:icon="@mipmap/dhikri_logo"', text, count=1)
          else:
              text, count = re.subn(r'<application\b', '<application android:icon="@mipmap/dhikri_logo"', text, count=1)
              if count != 1:
                  raise SystemExit('Could not locate application tag in AndroidManifest.xml')
          text = re.sub(r'\s+android:roundIcon="@[^" ]+"', '', text)
          manifest.write_text(text, encoding='utf-8')
          print(f'Installed complete logo image {image.size}; generated all launcher densities.')
          PY

      - name: Audit Android permissions and SDK configuration
        shell: bash
        run: |
          echo '===== AndroidManifest.xml ====='
          cat DhikriAndroid/app/src/main/AndroidManifest.xml
          echo '===== Gradle SDK and dependencies ====='
          grep -RInE 'compileSdk|targetSdk|minSdk|android.permission|uses-permission|FOREGROUND_SERVICE|SCHEDULE_EXACT_ALARM|POST_NOTIFICATIONS|RECEIVE_BOOT_COMPLETED' DhikriAndroid/app/src/main DhikriAndroid/*.gradle* DhikriAndroid/app/*.gradle* || true
          echo '===== Manifest permission declarations ====='
          grep -nE 'uses-permission|uses-feature|service|receiver|foregroundServiceType' DhikriAndroid/app/src/main/AndroidManifest.xml || true
          echo '===== Background scheduling source files ====='
          find DhikriAndroid/app/src/main -type f | grep -E '\\.(kt|java)
          echo '===== Alarm, reboot, and service references ====='
          grep -RInE 'class (BootReceiver|ReminderReceiver)|AlarmManager|setExact|setAndAllowWhileIdle|setExactAndAllowWhileIdle|BOOT_COMPLETED|AudioReminderService|startForegroundService|startService|ACTION_REQUEST_SCHEDULE_EXACT_ALARM|canScheduleExactAlarms|SharedPreferences|WorkManager' DhikriAndroid/app/src/main || true
          echo '===== App Gradle configuration ====='
          cat DhikriAndroid/app/build.gradle.kts

      - name: Add notification playback controls
        shell: bash
        run: |
          cat > DhikriAndroid/app/src/main/java/com/medhat/dhikri/AudioReminderService.kt <<'EOF'
          package com.medhat.dhikri

          import android.app.*
          import android.content.Intent
          import android.media.AudioAttributes
          import android.media.MediaPlayer
          import android.net.Uri
          import android.os.Build
          import android.os.IBinder

          class AudioReminderService : Service() {
              private var player: MediaPlayer? = null
              private var isPaused = false
              private var currentTitle = "ذِكري"

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  ensureNotificationChannel()
                  currentTitle = intent?.getStringExtra("title") ?: currentTitle

                  when (intent?.action) {
                      ACTION_PAUSE -> {
                          if (player?.isPlaying == true) player?.pause()
                          isPaused = true
                          startForeground(NOTIFICATION_ID, buildNotification(false))
                          return START_NOT_STICKY
                      }
                      ACTION_RESUME -> {
                          if (player != null && isPaused) {
                              player?.start()
                              isPaused = false
                              startForeground(NOTIFICATION_ID, buildNotification(true))
                          }
                          return START_NOT_STICKY
                      }
                      ACTION_STOP -> {
                          stopPlayback()
                          return START_NOT_STICKY
                      }
                  }

                  startForeground(NOTIFICATION_ID, buildNotification(true))
                  if (intent?.getBooleanExtra("missing_audio", false) == true) {
                      stopForeground(STOP_FOREGROUND_REMOVE)
                      stopSelf(startId)
                      return START_NOT_STICKY
                  }

                  val uriText = intent?.getStringExtra("audio_uri") ?: run {
                      stopForeground(STOP_FOREGROUND_REMOVE)
                      stopSelf(startId)
                      return START_NOT_STICKY
                  }

                  try {
                      player?.release()
                      isPaused = false
                      player = MediaPlayer().apply {
                          setAudioAttributes(
                              AudioAttributes.Builder()
                                  .setUsage(AudioAttributes.USAGE_NOTIFICATION)
                                  .setContentType(AudioAttributes.CONTENT_TYPE_SPEECH)
                                  .build()
                          )
                          setDataSource(this@AudioReminderService, Uri.parse(uriText))
                          setOnCompletionListener {
                              stopForeground(STOP_FOREGROUND_REMOVE)
                              player?.release()
                              player = null
                              stopSelf()
                          }
                          setOnErrorListener { _, _, _ ->
                              stopPlayback()
                              true
                          }
                          prepare()
                          start()
                      }
                  } catch (_: Exception) {
                      stopPlayback()
                  }
                  return START_NOT_STICKY
              }

              private fun buildNotification(playing: Boolean): Notification {
                  val toggleAction = if (playing) ACTION_PAUSE else ACTION_RESUME
                  val toggleLabel = if (playing) "إيقاف مؤقت" else "استئناف"
                  val toggleIcon = if (playing) android.R.drawable.ic_media_pause else android.R.drawable.ic_media_play

                  val toggleIntent = PendingIntent.getService(
                      this, 9010,
                      Intent(this, AudioReminderService::class.java)
                          .setAction(toggleAction)
                          .putExtra("title", currentTitle),
                      pendingIntentFlags()
                  )
                  val stopIntent = PendingIntent.getService(
                      this, 9011,
                      Intent(this, AudioReminderService::class.java)
                          .setAction(ACTION_STOP)
                          .putExtra("title", currentTitle),
                      pendingIntentFlags()
                  )

                  return Notification.Builder(this, CHANNEL_ID)
                      .setContentTitle("ذِكري")
                      .setContentText(currentTitle)
                      .setSmallIcon(android.R.drawable.ic_lock_idle_alarm)
                      .setCategory(Notification.CATEGORY_TRANSPORT)
                      .setVisibility(Notification.VISIBILITY_PUBLIC)
                      .setOnlyAlertOnce(true)
                      .setOngoing(true)
                      .addAction(Notification.Action.Builder(toggleIcon, toggleLabel, toggleIntent).build())
                      .addAction(Notification.Action.Builder(android.R.drawable.ic_menu_close_clear_cancel, "إيقاف", stopIntent).build())
                      .build()
              }

              private fun pendingIntentFlags(): Int {
                  return PendingIntent.FLAG_UPDATE_CURRENT or
                      if (Build.VERSION.SDK_INT >= 23) PendingIntent.FLAG_IMMUTABLE else 0
              }

              private fun stopPlayback() {
                  try { player?.stop() } catch (_: Exception) {}
                  player?.release()
                  player = null
                  isPaused = false
                  stopForeground(STOP_FOREGROUND_REMOVE)
                  stopSelf()
              }

              private fun ensureNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= 26) {
                      val manager = getSystemService(NotificationManager::class.java)
                      if (manager.getNotificationChannel(CHANNEL_ID) == null) {
                          val channel = NotificationChannel(
                              CHANNEL_ID,
                              "تذكيرات ذِكري",
                              NotificationManager.IMPORTANCE_HIGH
                          )
                          channel.description = "إشعارات التذكير بالأذكار والتحكم في الصوت"
                          manager.createNotificationChannel(channel)
                      }
                  }
              }

              override fun onDestroy() {
                  player?.release()
                  player = null
                  super.onDestroy()
              }

              companion object {
                  private const val CHANNEL_ID = "dhikri_reminders"
                  private const val NOTIFICATION_ID = 9001
                  private const val ACTION_PAUSE = "com.medhat.dhikri.ACTION_PAUSE"
                  private const val ACTION_RESUME = "com.medhat.dhikri.ACTION_RESUME"
                  private const val ACTION_STOP = "com.medhat.dhikri.ACTION_STOP"
              }
          }
          EOF

      - name: Align Java and Kotlin JVM targets
        shell: bash
        run: |
          cat >> DhikriAndroid/app/build.gradle.kts <<'EOF'

          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

      - name: Build debug APK
        shell: bash
        run: |
          cd DhikriAndroid
          gradle --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Dhikri-debug-apk
          path: DhikriAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
 || true
          echo '===== Kotlin and Java source contents ====='
          while IFS= read -r file; do echo "===== $file ====="; cat "$file"; done < <(find DhikriAndroid/app/src/main -type f | grep -E '\\.(kt|java)
          echo '===== Alarm, reboot, and service references ====='
          grep -RInE 'class (BootReceiver|ReminderReceiver)|AlarmManager|setExact|setAndAllowWhileIdle|setExactAndAllowWhileIdle|BOOT_COMPLETED|AudioReminderService|startForegroundService|startService|ACTION_REQUEST_SCHEDULE_EXACT_ALARM|canScheduleExactAlarms|SharedPreferences|WorkManager' DhikriAndroid/app/src/main || true
          echo '===== App Gradle configuration ====='
          cat DhikriAndroid/app/build.gradle.kts

