name: Build Dhikri Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'source/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore Android source archive
        shell: bash
        run: |
          cat source/part-1.b64 source/part-2.b64 source/part-3.b64 source/part-4a.b64 source/part-4b.b64 source/part-4c.b64 source/part-4d.b64 > /tmp/dhikri-source.zip.b64
          base64 --decode /tmp/dhikri-source.zip.b64 > /tmp/dhikri-source.zip
          unzip -tq /tmp/dhikri-source.zip
          unzip -q /tmp/dhikri-source.zip -d .
          test -f DhikriAndroid/app/build.gradle.kts
      - name: Build debug APK
        shell: bash
        run: |
          cd DhikriAndroid
          gradle --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Dhikri-debug-apk
          path: DhikriAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
