name: Build Dhikri Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'source/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore Android source archive
        shell: bash
        run: |
          cat source/part-1.b64 source/part-2.b64 source/part-3.b64 source/part-4a.b64 source/part-4b.b64 source/part-4c.b64 source/part-4d.b64 > /tmp/dhikri-source.zip.b64
          base64 --decode /tmp/dhikri-source.zip.b64 > /tmp/dhikri-source.zip
          unzip -tq /tmp/dhikri-source.zip
          unzip -q /tmp/dhikri-source.zip -d .
          test -f DhikriAndroid/app/build.gradle.kts

      - name: Implement configurable sleep schedule
        shell: bash
        run: |
          cat > DhikriAndroid/app/src/main/java/com/medhat/dhikri/SleepModeManager.kt <<'EOF'
          package com.medhat.dhikri

          import android.content.Context
          import java.util.Calendar

          object SleepModeManager {
              private const val PREFS = "dhikri"
              private const val ENABLED = "sleep_enabled"
              private const val START = "sleep_start"
              private const val END = "sleep_end"

              fun enabled(context: Context): Boolean =
                  context.getSharedPreferences(PREFS, Context.MODE_PRIVATE).getBoolean(ENABLED, false)

              fun start(context: Context): String =
                  context.getSharedPreferences(PREFS, Context.MODE_PRIVATE).getString(START, "23:00") ?: "23:00"

              fun end(context: Context): String =
                  context.getSharedPreferences(PREFS, Context.MODE_PRIVATE).getString(END, "07:00") ?: "07:00"

              fun isSleeping(context: Context, atMillis: Long = System.currentTimeMillis()): Boolean {
                  if (!enabled(context)) return false
                  val from = minutes(start(context)) ?: return false
                  val until = minutes(end(context)) ?: return false
                  if (from == until) return false
                  val cal = Calendar.getInstance().apply { timeInMillis = atMillis }
                  val now = cal.get(Calendar.HOUR_OF_DAY) * 60 + cal.get(Calendar.MINUTE)
                  return if (from < until) now >= from && now < until
                  else now >= from || now < until
              }

              fun nextBoundary(context: Context, nowMillis: Long = System.currentTimeMillis()): Long? {
                  if (!enabled(context)) return null
                  val target = if (isSleeping(context, nowMillis)) end(context) else start(context)
                  val parts = target.split(":")
                  val hour = parts.getOrNull(0)?.toIntOrNull() ?: return null
                  val minute = parts.getOrNull(1)?.toIntOrNull() ?: return null
                  return Calendar.getInstance().apply {
                      timeInMillis = nowMillis
                      set(Calendar.HOUR_OF_DAY, hour)
                      set(Calendar.MINUTE, minute)
                      set(Calendar.SECOND, 0)
                      set(Calendar.MILLISECOND, 0)
                      if (timeInMillis <= nowMillis) add(Calendar.DAY_OF_YEAR, 1)
                  }.timeInMillis
              }

              private fun minutes(value: String): Int? {
                  val p = value.split(":")
                  if (p.size != 2) return null
                  val h = p[0].toIntOrNull() ?: return null
                  val m = p[1].toIntOrNull() ?: return null
                  if (h !in 0..23 || m !in 0..59) return null
                  return h * 60 + m
              }
          }
          EOF

          python3 - <<'PY'
          from pathlib import Path
          p = Path('DhikriAndroid/app/src/main/java/com/medhat/dhikri/ReminderScheduler.kt')
          s = p.read_text()
          s = s.replace('''        if (prefs.getBoolean("interval_on", false)) {
                      val minutes = prefs.getInt("interval_minutes", 30).coerceIn(1, 1440)
                      val dhikrId = prefs.getString("interval_dhikr", "salawat") ?: "salawat"
                      schedule(context, am, INTERVAL_ID, System.currentTimeMillis() + minutes * 60_000L, dhikrId)
                  }''','''        scheduleSleepBoundary(context, am)
                  if (SleepModeManager.isSleeping(context)) {
                      context.stopService(Intent(context, AudioReminderService::class.java))
                      return
                  }

                  if (prefs.getBoolean("interval_on", false)) {
                      val minutes = prefs.getInt("interval_minutes", 30).coerceIn(1, 1440)
                      val dhikrId = prefs.getString("interval_dhikr", "salawat") ?: "salawat"
                      val next = System.currentTimeMillis() + minutes * 60_000L
                      if (!SleepModeManager.isSleeping(context, next)) schedule(context, am, INTERVAL_ID, next, dhikrId)
                  }''')
          s = s.replace('''                schedule(context, am, DAILY_BASE + index, cal.timeInMillis, parts[1])''','''                while (SleepModeManager.isSleeping(context, cal.timeInMillis)) cal.add(Calendar.DAY_OF_YEAR, 1)
                          schedule(context, am, DAILY_BASE + index, cal.timeInMillis, parts[1])''')
          s = s.replace('''        if (!prefs.getBoolean("interval_on", false)) return
                  val minutes = prefs.getInt("interval_minutes", 30).coerceIn(1, 1440)
                  val dhikrId = prefs.getString("interval_dhikr", "salawat") ?: "salawat"
                  val am = context.getSystemService(Context.ALARM_SERVICE) as AlarmManager
                  schedule(context, am, INTERVAL_ID, System.currentTimeMillis() + minutes * 60_000L, dhikrId)''','''        if (!prefs.getBoolean("interval_on", false) || SleepModeManager.isSleeping(context)) return
                  val minutes = prefs.getInt("interval_minutes", 30).coerceIn(1, 1440)
                  val dhikrId = prefs.getString("interval_dhikr", "salawat") ?: "salawat"
                  val am = context.getSystemService(Context.ALARM_SERVICE) as AlarmManager
                  val next = System.currentTimeMillis() + minutes * 60_000L
                  if (!SleepModeManager.isSleeping(context, next)) schedule(context, am, INTERVAL_ID, next, dhikrId)''')
          s = s.replace('''        schedule(context, am, requestId, cal.timeInMillis, parts[1])''','''        while (SleepModeManager.isSleeping(context, cal.timeInMillis)) cal.add(Calendar.DAY_OF_YEAR, 1)
                  schedule(context, am, requestId, cal.timeInMillis, parts[1])''')
          s = s.replace('''    private fun schedule(context: Context, am: AlarmManager, id: Int, at: Long, dhikrId: String) {''','''    private fun scheduleSleepBoundary(context: Context, am: AlarmManager) {
                  val boundary = SleepModeManager.nextBoundary(context) ?: return
                  val intent = Intent(context, ReminderReceiver::class.java).putExtra("request_id", 7102)
                  val pi = PendingIntent.getBroadcast(context, 7102, intent, PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)
                  if (android.os.Build.VERSION.SDK_INT >= 23) am.setExactAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, boundary, pi)
                  else am.setExact(AlarmManager.RTC_WAKEUP, boundary, pi)
              }

              private fun schedule(context: Context, am: AlarmManager, id: Int, at: Long, dhikrId: String) {''')
          s = s.replace('''(listOf(INTERVAL_ID) + (DAILY_BASE..DAILY_BASE + 99).toList()).forEach''','''(listOf(INTERVAL_ID, 7102) + (DAILY_BASE..DAILY_BASE + 99).toList()).forEach''')
          if 'scheduleSleepBoundary(context, am)' not in s or '7102' not in s:
              raise SystemExit('Sleep scheduler patch did not apply')
          p.write_text(s)

          p = Path('DhikriAndroid/app/src/main/java/com/medhat/dhikri/ReminderReceiver.kt')
          s = p.read_text()
          s = s.replace('''        val requestId = intent.getIntExtra("request_id", -1)''','''        val requestId = intent.getIntExtra("request_id", -1)
                  if (requestId == 7102) {
                      ReminderScheduler.scheduleAll(context)
                      return
                  }
                  if (SleepModeManager.isSleeping(context)) {
                      ReminderScheduler.scheduleAll(context)
                      return
                  }''')
          p.write_text(s)

          p = Path('DhikriAndroid/app/src/main/java/com/medhat/dhikri/MainActivity.kt')
          s = p.read_text()
          s = s.replace('''    private lateinit var dailySwitch: Switch''','''    private lateinit var dailySwitch: Switch
                  private lateinit var sleepSwitch: Switch
                  private lateinit var sleepStartButton: Button
                  private lateinit var sleepEndButton: Button
                  private var sleepStartValue = "23:00"
                  private var sleepEndValue = "07:00"''')
          s = s.replace('''        section("مكتبة التسجيلات الصوتية")''','''        section("وضع النوم والتشغيل التلقائي")
                  sleepSwitch = Switch(this).apply {
                      text = "إيقاف كل التذكيرات أثناء النوم"; textSize = 17f
                      isChecked = prefs.getBoolean("sleep_enabled", false)
                  }
                  sleepStartValue = prefs.getString("sleep_start", "23:00") ?: "23:00"
                  sleepEndValue = prefs.getString("sleep_end", "07:00") ?: "07:00"
                  page.addView(sleepSwitch, matchWrap())
                  sleepStartButton = Button(this).apply {
                      text = "وقت بدء النوم: $sleepStartValue"
                      setOnClickListener { chooseSleepTime(true) }
                  }
                  page.addView(sleepStartButton, matchWrap())
                  sleepEndButton = Button(this).apply {
                      text = "وقت الاستيقاظ: $sleepEndValue"
                      setOnClickListener { chooseSleepTime(false) }
                  }
                  page.addView(sleepEndButton, matchWrap())
                  page.addView(label("أثناء النوم يتوقف الصوت والإشعارات. التذكيرات التي يفوت موعدها لا تعمل متأخرة، وتعود المواعيد القادمة تلقائيًا عند الاستيقاظ."), matchWrap())

                  section("مكتبة التسجيلات الصوتية")''')
          s = s.replace('''            .putString("daily_schedules", schedules.joinToString(";"))
                      .apply()''','''            .putString("daily_schedules", schedules.joinToString(";"))
                      .putBoolean("sleep_enabled", sleepSwitch.isChecked)
                      .putString("sleep_start", sleepStartValue)
                      .putString("sleep_end", sleepEndValue)
                      .apply()''')
          s = s.replace('''        ReminderScheduler.scheduleAll(this)
                  refreshStatus()''','''        ReminderScheduler.scheduleAll(this)
                  refreshStatus()''')
          s = s.replace('''    private fun playDhikr(id: String) {''','''    private fun chooseSleepTime(isStart: Boolean) {
                  val current = if (isStart) sleepStartValue else sleepEndValue
                  val parts = current.split(":")
                  val hour = parts.getOrNull(0)?.toIntOrNull() ?: if (isStart) 23 else 7
                  val minute = parts.getOrNull(1)?.toIntOrNull() ?: 0
                  TimePickerDialog(this, { _, h, m ->
                      val value = String.format(Locale.US, "%02d:%02d", h, m)
                      if (isStart) {
                          sleepStartValue = value
                          sleepStartButton.text = "وقت بدء النوم: $value"
                      } else {
                          sleepEndValue = value
                          sleepEndButton.text = "وقت الاستيقاظ: $value"
                      }
                  }, hour, minute, true).show()
              }

              private fun playDhikr(id: String) {''')
          s = s.replace('''        if (dailySwitch.isChecked && schedules.isEmpty()) {''','''        if (sleepSwitch.isChecked && sleepStartValue == sleepEndValue) {
                      Toast.makeText(this, "وقت النوم ووقت الاستيقاظ لازم يكونوا مختلفين", Toast.LENGTH_LONG).show()
                      return
                  }
                  if (dailySwitch.isChecked && schedules.isEmpty()) {''')
          s = s.replace('''    private fun playDhikr(id: String) {''','''    private fun playDhikr(id: String) {
                      if (SleepModeManager.isSleeping(this)) {
                          Toast.makeText(this, "وضع النوم مفعّل؛ سيتم استئناف التذكيرات في وقت الاستيقاظ", Toast.LENGTH_LONG).show()
                          return
                      }''')
          if 'chooseSleepTime' not in s or 'sleep_enabled' not in s:
              raise SystemExit('Sleep settings UI patch did not apply')
          p.write_text(s)
          PY

          echo 'Sleep mode source changes applied.'
          sed -n '1,260p' DhikriAndroid/app/src/main/java/com/medhat/dhikri/ReminderScheduler.kt
          sed -n '1,140p' DhikriAndroid/app/src/main/java/com/medhat/dhikri/ReminderReceiver.kt

      - name: Upgrade Dhikri design and multiple periodic reminders
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          root = Path('DhikriAndroid/app/src/main/java/com/medhat/dhikri')
          p = root / 'MainActivity.kt'
          s = p.read_text()
          s, n = re.subn(r'private lateinit var intervalInput: EditText\s+private lateinit var intervalDhikr: Spinner',
              'private lateinit var intervalRows: LinearLayout', s, count=1)
          if n != 1: raise SystemExit('Could not replace single-interval UI fields')
          ui = '''        intervalRows = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  page.addView(intervalRows, matchWrap())
                  val savedIntervals = prefs.getString("interval_schedules", null)
                  if (!savedIntervals.isNullOrBlank()) {
                      savedIntervals.split(";").forEach { entry ->
                          val parts = entry.split("|")
                          if (parts.size == 2) addIntervalRow(parts[0], parts[1])
                      }
                  } else {
                      addIntervalRow(prefs.getInt("interval_minutes", 30).toString(),
                          prefs.getString("interval_dhikr", "salawat") ?: "salawat")
                  }
                  page.addView(Button(this).apply {
                      text = "+ إضافة تذكير دوري"
                      setOnClickListener { addIntervalRow("30", "salawat") }
                  }, matchWrap())'''
          s, n = re.subn(r'        intervalInput = EditText\(this\)\.apply \{.*?page\.addView\(intervalDhikr, matchWrap\(\)\)',
              lambda m: ui, s, count=1, flags=re.S)
          if n != 1: raise SystemExit('Could not replace old periodic reminder controls')
          validation = '''        val intervalSchedules = mutableListOf<String>()
                  for (i in 0 until intervalRows.childCount) {
                      val row = intervalRows.getChildAt(i) as LinearLayout
                      val input = row.getChildAt(0) as EditText
                      val minutes = input.text.toString().toIntOrNull()
                      if (minutes == null || minutes !in 1..1440) {
                          input.error = "أدخل مدة من 1 إلى 1440 دقيقة"; return
                      }
                      val spinner = row.getChildAt(1) as Spinner
                      intervalSchedules.add("$minutes|\${spinnerDhikrId(spinner)}")
                  }
                  if (intervalSwitch.isChecked && intervalSchedules.isEmpty()) {
                      Toast.makeText(this, "أضف تذكيرًا دوريًا واحدًا على الأقل", Toast.LENGTH_SHORT).show(); return
                  }
                  val schedules = mutableListOf<String>()'''
          s, n = re.subn(r'        val minutes = intervalInput\.text\.toString\(\)\.toIntOrNull\(\).*?        val schedules = mutableListOf<String>\(\)',
              lambda m: validation, s, count=1, flags=re.S)
          if n != 1: raise SystemExit('Could not replace periodic validation and serialization')
          s = s.replace('''.putInt("interval_minutes", minutes ?: 30)
                      .putString("interval_dhikr", spinnerDhikrId(intervalDhikr))''',
              '''.putInt("interval_minutes", intervalSchedules.firstOrNull()?.substringBefore("|")?.toIntOrNull() ?: 30)
                      .putString("interval_dhikr", intervalSchedules.firstOrNull()?.substringAfter("|") ?: "salawat")
                      .putString("interval_schedules", intervalSchedules.joinToString(";"))''', 1)
          if 'putString("interval_schedules"' not in s: raise SystemExit('Could not save periodic reminder list')
          methods = '''    private fun addIntervalRow(minutes: String, dhikrId: String) {
                  val row = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(8, 4, 8, 4)
                      setBackgroundColor(0xFFEAF1EB.toInt())
                  }
                  val input = EditText(this).apply {
                      hint = "الدقائق"; inputType = android.text.InputType.TYPE_CLASS_NUMBER
                      setSingleLine(true); textSize = 16f; setText(minutes)
                  }
                  val spinner = makeDhikrSpinner(dhikrId)
                  val remove = Button(this).apply {
                      text = "حذف"; setOnClickListener { intervalRows.removeView(row) }
                  }
                  row.addView(input, LinearLayout.LayoutParams(0, -2, 0.75f))
                  row.addView(spinner, LinearLayout.LayoutParams(0, -2, 1.5f))
                  row.addView(remove, LinearLayout.LayoutParams(0, -2, 0.65f))
                  val lp = LinearLayout.LayoutParams(-1, -2).apply { setMargins(0, 4, 0, 8) }
                  intervalRows.addView(row, lp)
              }

              private fun applyVisualTheme(root: android.view.ViewGroup) {
                  val accent = 0xFF17664D.toInt()
                  val ink = 0xFF20392E.toInt()
                  fun visit(group: android.view.ViewGroup) {
                      for (i in 0 until group.childCount) {
                          val child = group.getChildAt(i)
                          when (child) {
                              is Button -> {
                                  child.backgroundTintList = android.content.res.ColorStateList.valueOf(accent)
                                  child.setTextColor(0xFFFFFFFF.toInt())
                                  child.textSize = 16f
                                  child.minHeight = (52 * resources.displayMetrics.density).toInt()
                                  child.typeface = android.graphics.Typeface.DEFAULT_BOLD
                                  child.setPadding(16, 10, 16, 10)
                              }
                              is EditText -> {
                                  child.textSize = 17f
                                  child.setPadding(14, 12, 14, 12)
                              }
                              is TextView -> {
                                  child.setTextColor(ink)
                                  child.setPadding(child.paddingLeft, maxOf(child.paddingTop, 8), child.paddingRight, maxOf(child.paddingBottom, 8))
                              }
                          }
                          if (child is android.view.ViewGroup) visit(child)
                      }
                  }
                  visit(root)
              }

          '''
          if 'private fun addIntervalRow' not in s:
              s = s.replace('    private fun addScheduleRow(time: String, dhikrId: String) {', methods + '    private fun addScheduleRow(time: String, dhikrId: String) {', 1)
          s = s.replace('''        page.addView(label("ملاحظة: قد تحتاج بعض الهواتف إلى السماح بالتشغيل التلقائي واستثناء التطبيق من تحسين البطارية لضمان وصول التذكيرات في موعدها."))''',
              '''        page.addView(label("ملاحظة: قد تحتاج بعض الهواتف إلى السماح بالتشغيل التلقائي واستثناء التطبيق من تحسين البطارية لضمان وصول التذكيرات في موعدها."))
                  applyVisualTheme(page)''', 1)
          p.write_text(s)

          p = root / 'ReminderScheduler.kt'
          s = p.read_text()
          s, n = re.subn(r'private const val INTERVAL_ID = 7101\s+private const val DAILY_BASE = 7200',
              'private const val INTERVAL_BASE = 7101\n    private const val INTERVAL_LAST = 7199\n    private const val DAILY_BASE = 7200', s, count=1)
          if n != 1: raise SystemExit('Could not expand interval alarm ID range')
          block = '''        if (prefs.getBoolean("interval_on", false)) {
                      val saved = prefs.getString("interval_schedules", "") ?: ""
                      val entries = if (saved.isBlank()) listOf(
                          "${prefs.getInt("interval_minutes", 30)}|${prefs.getString("interval_dhikr", "salawat") ?: "salawat"}"
                      ) else saved.split(";")
                      entries.take(INTERVAL_LAST - INTERVAL_BASE + 1).forEachIndexed { index, entry ->
                          val parts = entry.split("|")
                          if (parts.size != 2) return@forEachIndexed
                          val minutes = parts[0].toIntOrNull()?.coerceIn(1, 1440) ?: return@forEachIndexed
                          val next = System.currentTimeMillis() + minutes * 60_000L
                          if (!SleepModeManager.isSleeping(context, next))
                              schedule(context, am, INTERVAL_BASE + index, next, parts[1])
                      }
                  }'''
          s, n = re.subn(r'        if \(prefs\.getBoolean\("interval_on", false\)\) \{.*?\n        \}\n\n        if \(prefs\.getBoolean\("daily_on", false\)\)',
              lambda m: block + '\n\n        if (prefs.getBoolean("daily_on", false))', s, count=1, flags=re.S)
          if n != 1: raise SystemExit('Could not replace scheduler interval block')
          fn = '''    fun scheduleNextInterval(context: Context, requestId: Int) {
                  val prefs = context.getSharedPreferences("dhikri", Context.MODE_PRIVATE)
                  if (!prefs.getBoolean("interval_on", false) || SleepModeManager.isSleeping(context)) return
                  val index = requestId - INTERVAL_BASE
                  if (index !in 0..(INTERVAL_LAST - INTERVAL_BASE)) return
                  val saved = prefs.getString("interval_schedules", "") ?: ""
                  val entries = if (saved.isBlank()) listOf(
                      "${prefs.getInt("interval_minutes", 30)}|${prefs.getString("interval_dhikr", "salawat") ?: "salawat"}"
                  ) else saved.split(";")
                  val parts = entries.getOrNull(index)?.split("|") ?: return
                  if (parts.size != 2) return
                  val minutes = parts[0].toIntOrNull()?.coerceIn(1, 1440) ?: return
                  val am = context.getSystemService(Context.ALARM_SERVICE) as AlarmManager
                  val next = System.currentTimeMillis() + minutes * 60_000L
                  if (!SleepModeManager.isSleeping(context, next)) schedule(context, am, requestId, next, parts[1])
              }'''
          s, n = re.subn(r'    fun scheduleNextInterval\(context: Context\) \{.*?\n    \}', lambda m: fn, s, count=1, flags=re.S)
          if n != 1: raise SystemExit('Could not replace interval rescheduling function')
          s = s.replace('(listOf(INTERVAL_ID, 7102) + (DAILY_BASE..DAILY_BASE + 99).toList())',
              '((INTERVAL_BASE..INTERVAL_LAST).toList() + 7102 + (DAILY_BASE..DAILY_BASE + 99).toList())')
          if 'INTERVAL_ID' in s: raise SystemExit('Old single interval ID remains in scheduler')
          p.write_text(s)

          p = root / 'ReminderReceiver.kt'
          s = p.read_text()
          s, n = re.subn(r'if \(requestId == 7101\) ReminderScheduler\.scheduleNextInterval\(context\)\s+else if \(requestId >= 7200\)',
              'if (requestId in 7101..7199) ReminderScheduler.scheduleNextInterval(context, requestId)\n        else if (requestId >= 7200)', s, count=1)
          if n != 1: raise SystemExit('Could not route periodic reminder alarms')
          p.write_text(s)
          print("Independent periodic reminders and UI styling patch applied.")
          PY

      - name: Inspect source and scheduling implementation
        shell: bash
        run: |
          echo '===== Kotlin / Java source files ====='
          find DhikriAndroid/app/src/main -type f \( -name '*.kt' -o -name '*.java' \) -print
          echo '===== Scheduling and activity source ====='
          while IFS= read -r file; do
            echo "===== $file ====="
            sed -n '1,320p' "$file"
          done < <(find DhikriAndroid/app/src/main -type f \( -name '*.kt' -o -name '*.java' \) -print)
          echo '===== Manifest ====='
          cat DhikriAndroid/app/src/main/AndroidManifest.xml
          echo '===== Gradle ====='
          cat DhikriAndroid/app/build.gradle.kts

      - name: Install complete Dhikri logo
        shell: bash
        run: |
          python3 -m pip install --quiet pillow
          curl -fL --retry 3 'https://raw.githubusercontent.com/MedhatCoding/-/main/assets/branding/dhikri-logo.png' -o /tmp/dhikri-logo.png
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          import re
          root = Path('DhikriAndroid/app/src/main')
          manifest = root / 'AndroidManifest.xml'
          text = manifest.read_text(encoding='utf-8')
          image = Image.open('/tmp/dhikri-logo.png').convert('RGBA')
          if image.width < 64 or image.height < 64:
              raise SystemExit(f'Logo image is unexpectedly small: {image.size}')
          sizes = {'mipmap-mdpi':48, 'mipmap-hdpi':72, 'mipmap-xhdpi':96, 'mipmap-xxhdpi':144, 'mipmap-xxxhdpi':192}
          for folder, size in sizes.items():
              target = root / 'res' / folder
              target.mkdir(parents=True, exist_ok=True)
              image.resize((size, size), Image.Resampling.LANCZOS).save(target / 'dhikri_logo.png', optimize=True)
          if re.search(r'android:icon="@[^" ]+"', text):
              text = re.sub(r'android:icon="@[^" ]+"', 'android:icon="@mipmap/dhikri_logo"', text, count=1)
          else:
              text, count = re.subn(r'<application\b', '<application android:icon="@mipmap/dhikri_logo"', text, count=1)
              if count != 1:
                  raise SystemExit('Could not locate application tag in AndroidManifest.xml')
          text = re.sub(r'\s+android:roundIcon="@[^" ]+"', '', text)
          manifest.write_text(text, encoding='utf-8')
          print(f'Installed complete logo image {image.size}; generated all launcher densities.')
          PY

      - name: Add real media-session notification controls
        shell: bash
        run: |
          cat > DhikriAndroid/app/src/main/java/com/medhat/dhikri/AudioReminderService.kt <<'EOF'
          package com.medhat.dhikri

          import android.app.*
          import android.content.Intent
          import android.media.AudioAttributes
          import android.media.MediaPlayer
          import android.media.session.MediaSession
          import android.media.session.PlaybackState
          import android.net.Uri
          import android.os.Build
          import android.os.IBinder

          class AudioReminderService : Service() {
              private var player: MediaPlayer? = null
              private var session: MediaSession? = null
              private var paused = false
              private var currentTitle = "ذِكري"

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  ensureNotificationChannel()
                  currentTitle = intent?.getStringExtra("title") ?: currentTitle
                  when (intent?.action) {
                      ACTION_PAUSE -> {
                          if (player?.isPlaying == true) player?.pause()
                          paused = true
                          updatePlaybackState(false)
                          startForeground(NOTIFICATION_ID, buildNotification(false))
                          return START_NOT_STICKY
                      }
                      ACTION_RESUME -> {
                          if (player != null && paused) {
                              player?.start()
                              paused = false
                              updatePlaybackState(true)
                              startForeground(NOTIFICATION_ID, buildNotification(true))
                          }
                          return START_NOT_STICKY
                      }
                      ACTION_STOP -> {
                          stopPlayback()
                          return START_NOT_STICKY
                      }
                  }

                  startForeground(NOTIFICATION_ID, buildNotification(true))
                  if (intent?.getBooleanExtra("missing_audio", false) == true) {
                      stopForeground(STOP_FOREGROUND_REMOVE); stopSelf(startId)
                      return START_NOT_STICKY
                  }
                  val uriText = intent?.getStringExtra("audio_uri") ?: run {
                      stopForeground(STOP_FOREGROUND_REMOVE); stopSelf(startId)
                      return START_NOT_STICKY
                  }
                  try {
                      player?.release()
                      paused = false
                      player = MediaPlayer().apply {
                          setAudioAttributes(AudioAttributes.Builder()
                              .setUsage(AudioAttributes.USAGE_MEDIA)
                              .setContentType(AudioAttributes.CONTENT_TYPE_SPEECH).build())
                          setDataSource(this@AudioReminderService, Uri.parse(uriText))
                          setOnCompletionListener { stopPlayback() }
                          setOnErrorListener { _, _, _ -> stopPlayback(); true }
                          prepare()
                          start()
                      }
                      ensureMediaSession()
                      updatePlaybackState(true)
                      getSystemService(NotificationManager::class.java).notify(NOTIFICATION_ID, buildNotification(true))
                  } catch (_: Exception) { stopPlayback() }
                  return START_NOT_STICKY
              }

              private fun ensureMediaSession() {
                  if (session == null) {
                      session = MediaSession(this, "DhikriPlayback").apply {
                          setCallback(object : MediaSession.Callback() {
                              override fun onPlay() { handleAction(ACTION_RESUME) }
                              override fun onPause() { handleAction(ACTION_PAUSE) }
                              override fun onStop() { handleAction(ACTION_STOP) }
                          })
                          isActive = true
                      }
                  }
                  session?.setMetadata(android.media.MediaMetadata.Builder()
                      .putString(android.media.MediaMetadata.METADATA_TITLE, currentTitle)
                      .putString(android.media.MediaMetadata.METADATA_ARTIST, "ذِكري")
                      .build())
              }

              private fun handleAction(action: String) {
                  val intent = Intent(this, AudioReminderService::class.java).setAction(action)
                  if (Build.VERSION.SDK_INT >= 26) startForegroundService(intent) else startService(intent)
              }

              private fun updatePlaybackState(playing: Boolean) {
                  ensureMediaSession()
                  val actions = PlaybackState.ACTION_PLAY or PlaybackState.ACTION_PAUSE or
                      PlaybackState.ACTION_PLAY_PAUSE or PlaybackState.ACTION_STOP
                  val state = if (playing) PlaybackState.STATE_PLAYING else PlaybackState.STATE_PAUSED
                  session?.setPlaybackState(PlaybackState.Builder()
                      .setActions(actions).setState(state, if (playing) 0L else 0L, if (playing) 1f else 0f)
                      .build())
              }

              private fun buildNotification(playing: Boolean): Notification {
                  ensureMediaSession()
                  val toggleAction = if (playing) ACTION_PAUSE else ACTION_RESUME
                  val toggleLabel = if (playing) "إيقاف مؤقت" else "استئناف"
                  val toggleIcon = if (playing) android.R.drawable.ic_media_pause else android.R.drawable.ic_media_play
                  val toggle = PendingIntent.getService(this, 9010,
                      Intent(this, AudioReminderService::class.java).setAction(toggleAction), pendingFlags())
                  val stop = PendingIntent.getService(this, 9011,
                      Intent(this, AudioReminderService::class.java).setAction(ACTION_STOP), pendingFlags())
                  val builder = Notification.Builder(this, CHANNEL_ID)
                      .setContentTitle("ذِكري").setContentText(currentTitle)
                      .setSmallIcon(android.R.drawable.ic_lock_idle_alarm)
                      .setCategory(Notification.CATEGORY_TRANSPORT)
                      .setVisibility(Notification.VISIBILITY_PUBLIC)
                      .setOnlyAlertOnce(true).setOngoing(true)
                      .addAction(toggleIcon, toggleLabel, toggle)
                      .addAction(android.R.drawable.ic_menu_close_clear_cancel, "إيقاف", stop)
                  if (Build.VERSION.SDK_INT >= 21) {
                      builder.setStyle(Notification.MediaStyle()
                          .setMediaSession(session?.sessionToken)
                          .setShowActionsInCompactView(0, 1))
                  }
                  return builder.build()
              }

              private fun pendingFlags() = PendingIntent.FLAG_UPDATE_CURRENT or
                  if (Build.VERSION.SDK_INT >= 23) PendingIntent.FLAG_IMMUTABLE else 0

              private fun stopPlayback() {
                  try { player?.stop() } catch (_: Exception) {}
                  player?.release(); player = null; paused = false
                  session?.setPlaybackState(PlaybackState.Builder()
                      .setActions(PlaybackState.ACTION_PLAY).setState(PlaybackState.STATE_STOPPED, 0L, 0f).build())
                  session?.isActive = false
                  stopForeground(STOP_FOREGROUND_REMOVE)
                  stopSelf()
              }

              private fun ensureNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= 26) {
                      val manager = getSystemService(NotificationManager::class.java)
                      if (manager.getNotificationChannel(CHANNEL_ID) == null) {
                          val channel = NotificationChannel(CHANNEL_ID, "تذكيرات ذِكري", NotificationManager.IMPORTANCE_LOW)
                          channel.description = "تشغيل الأذكار والتحكم بها من ستارة الإشعارات"
                          manager.createNotificationChannel(channel)
                      }
                  }
              }

              override fun onDestroy() {
                  player?.release(); player = null
                  session?.release(); session = null
                  super.onDestroy()
              }

              companion object {
                  private const val CHANNEL_ID = "dhikri_reminders"
                  private const val NOTIFICATION_ID = 9001
                  private const val ACTION_PAUSE = "com.medhat.dhikri.ACTION_PAUSE"
                  private const val ACTION_RESUME = "com.medhat.dhikri.ACTION_RESUME"
                  private const val ACTION_STOP = "com.medhat.dhikri.ACTION_STOP"
              }
          }
          EOF

